<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="RxSuite - Cloud pharmacy management">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062B2A"/>
      <stop offset="0.55" stop-color="#0B4A46"/>
      <stop offset="1" stop-color="#0E7C73"/>
    </linearGradient>
    <pattern id="tiles" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect x="6" y="6" width="52" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#tiles)"/>
  <circle cx="1130" cy="70" r="150" fill="#F2A33A" fill-opacity="0.10"/>
  <circle cx="1210" cy="360" r="90" fill="#7FE0D4" fill-opacity="0.10"/>

  <g transform="translate(96 92) scale(1.5)">
    <rect x="44" y="6" width="32" height="32" rx="9" fill="#FFFFFF"/>
    <rect x="6" y="44" width="32" height="32" rx="9" fill="#FFFFFF"/>
    <rect x="44" y="44" width="32" height="32" rx="9" fill="#FFFFFF"/>
    <rect x="44" y="82" width="32" height="32" rx="9" fill="#FFFFFF"/>
    <circle cx="98" cy="60" r="16" fill="#F2A33A"/>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="320" y="190" font-size="112" font-weight="700" letter-spacing="-3" fill="#7FE0D4">Rx<tspan fill="#FFFFFF" font-weight="500">Suite</tspan></text>
    <text x="326" y="236" font-size="22" font-weight="500" letter-spacing="6" fill="#B9DAD6">CLOUD PHARMACY MANAGEMENT</text>

    <g font-size="17" font-weight="600" fill="#FFFFFF">
      <rect x="324" y="268" width="104" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
      <text x="376" y="293" text-anchor="middle">.NET 11</text>
      <rect x="440" y="268" width="96" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
      <text x="488" y="293" text-anchor="middle">Dapper</text>
      <rect x="548" y="268" width="196" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
      <text x="646" y="293" text-anchor="middle">Stored procedures</text>
      <rect x="756" y="268" width="190" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
      <text x="851" y="293" text-anchor="middle">Clean Architecture</text>
      <rect x="958" y="268" width="150" height="38" rx="19" fill="#F2A33A"/>
      <text x="1033" y="293" text-anchor="middle" fill="#062B2A">Multi-tenant</text>
    </g>
  </g>
</svg>
